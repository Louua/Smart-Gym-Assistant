smoothing:
  method: ema            # ema | savgol | median
  alpha: 0.4
  window: 7
visibility:
  min_visibility: 0.5
  max_hold_frames: 10
squat:
  standing_min: 160.0
  descent_start: 150.0
  bottom_max: 100.0
  ascent_hysteresis: 10.0
  trunk_lean_max: 45.0
  count_incomplete_extension: false
bicep_curl:
  extended_min: 150.0
  curling_start: 140.0
  flexed_max: 50.0
  lowering_start: 60.0
  shoulder_drift_max: 0.08   # fraction of torso length
scoring:
  weights:
    consistency: 0.3
    rom: 0.4
    stability: 0.3
